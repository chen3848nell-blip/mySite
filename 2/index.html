          advice: "順應時勢變化，把握當前浮現的機會，以開放的心態擁抱命運的安排。"
        },
        reversed: {
          keywords: ["運勢低迷", "抗拒改變", "重複錯誤", "不可控變數", "延誤"],
          meaning: "逆位命運之輪意味著遇到了暫時的阻礙或不幸的循環，可能因為抗拒改變而感到失落與沮喪。",
          advice: "接受眼前的變局，保持耐心，記住低谷過後必定是上升的開始。"
        }
      },
      {
        name_en: "The Sun",
        name_zh: "太陽",
        arcana: "Major",
        image: "https://upload.wikimedia.org/wikipedia/commons/1/17/RWS_Tarot_19_Sun.jpg",
        upright: {
          keywords: ["光明", "成功", "喜悅", "活力", "真誠"],
          meaning: "太陽是塔羅中最極致吉祥的牌之一。象徵著無比的活力、清晰的未來、豐碩的成果與純粹的快樂。",
          advice: "充滿自信地展現自我，分享你的喜悅，享受當前溫暖而光明的時光。"
        },
        reversed: {
          keywords: ["暫時陰霾", "過度樂觀", "精力耗盡", "延遲成功", "雲遮日"],
          meaning: "逆位太陽並非代表不幸，而是烏雲暫時遮蔽了陽光。成功可能會稍有延遲，或者你正感到熱情有所消退。",
          advice: "保持樂觀的心態，重新充電，小小的挫折無法阻擋最終的光明。"
        }
      },
      {
        name_en: "The World",
        name_zh: "世界",
        arcana: "Major",
        image: "https://upload.wikimedia.org/wikipedia/commons/ff/ff/RWS_Tarot_21_World.jpg",
        upright: {
          keywords: ["圓滿", "完成", "成就", "整合", "新階段"],
          meaning: "世界牌代表漫長旅程的完美終點與大圓滿。你的努力獲得了實質的成果，準備跨入更高階的人生階段。",
          advice: "為自己的成就喝彩，感恩一路上的收穫，準備迎接下一個精彩的人生篇章。"
        },
        reversed: {
          keywords: ["未竟之業", "欠缺臨門一腳", "拖延", "遺撼", "停滯"],
          meaning: "逆位世界暗示事情接近尾聲但仍缺臨門一腳，或是因細節疏忽而無法完美收官，留下少許遺憾。",
          advice: "檢視尚未完成的環節，補齊漏洞，堅持到底才能迎來真正的圓滿。"
        }
      }
    ];

    // Card Spreads Mapping Definitions
    const SPREAD_DEFINITIONS = {
      time: [
        { key: "past", label: "過去 (Past)", desc: "影響當前局勢的背景起源與遠因" },
        { key: "present", label: "現在 (Present)", desc: "當前所處的狀態、核心課題與考驗" },
        { key: "future", label: "未來 (Future)", desc: "若維持現狀將走向的發展發展與趨勢" }
      ],
      action: [
        { key: "situation", label: "現狀 (Situation)", desc: "您目前所面臨的真實情境與環境" },
        { key: "action", label: "對策 (Action)", desc: "建議採取的關鍵行動與心態調整" },
        { key: "outcome", label: "結果 (Outcome)", desc: "採取行動後最終預期獲得的突破與結果" }
      ]
    };

    let currentSpreadType = 'time';
    let drawnCards = [];

    // ----------------------------------------------------
    // Starfield Generator
    // ----------------------------------------------------
    function generateStarfield() {
      const container = document.getElementById('stars');
      container.innerHTML = '';
      const count = 50;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
        container.appendChild(star);
      }
    }

    // ----------------------------------------------------
    // API Fetcher with Fallback Handler
    // ----------------------------------------------------
    async function fetchTarotCards(count = 3) {
      try {
        // Attempting standard Tarot API fetch with timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const response = await fetch(`https://tarotapi.dev/api/v1/cards/random?n=${count}`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error('API Response Error');
        const data = await response.json();
        
        // Map API response and enrich with fallback local Traditional Chinese DB
        return data.cards.map(card => enrichCardData(card));
      } catch (err) {
        console.warn('Tarot API network request failed or timed out. Using high-quality built-in card library fallback.', err);
        return getRandomFallbackCards(count);
      }
    }

    // Enrich Card API output with Chinese interpretations
    function enrichCardData(apiCard) {
      // Search matching local card by name
      const localMatch = FALLBACK_DECK.find(
        item => item.name_en.toLowerCase() === apiCard.name.toLowerCase()
      );

      const isReversed = Math.random() < 0.35; // 35% chance of being reversed

      if (localMatch) {
        return {
          ...localMatch,
          isReversed: isReversed
        };
      }

      // Basic mapping for major arcana if not in fallback array
      return {
        name_en: apiCard.name,
        name_zh: apiCard.name,
        arcana: apiCard.type,
        image: "https://upload.wikimedia.org/wikipedia/commons/9/90/RWS_Tarot_00_Fool.jpg",
        isReversed: isReversed,
        upright: {
          keywords: apiCard.meaning_up.split(',').slice(0, 4),
          meaning: `正位象徵：${apiCard.meaning_up}。事物正朝著正向且順暢的方向前進。`,
          advice: "積極把握目前的優勢，順勢而為。"
        },
        reversed: {
          keywords: apiCard.meaning_rev.split(',').slice(0, 4),
          meaning: `逆位象徵：${apiCard.meaning_rev}。注意內部阻力或能量卡頓。`,
          advice: "適時放慢腳步，檢視潛在隱患。"
        }
      };
    }

    function getRandomFallbackCards(count) {
      const shuffled = [...FALLBACK_DECK].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count).map(card => ({
        ...card,
        isReversed: Math.random() < 0.35
      }));
    }

    // ----------------------------------------------------
    // UI Renderers & Interactions
    // ----------------------------------------------------
    function initSpreadSelector() {
      const buttons = document.querySelectorAll('.spread-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => {
            b.classList.remove('active', 'border-mystic-gold', 'bg-mystic-gold/20', 'text-mystic-goldLight');
            b.classList.add('border-slate-700', 'bg-mystic-900/60', 'text-slate-300');
          });
          btn.classList.add('active', 'border-mystic-gold', 'bg-mystic-gold/20', 'text-mystic-goldLight');
          btn.classList.remove('border-slate-700', 'bg-mystic-900/60', 'text-slate-300');
          currentSpreadType = btn.getAttribute('data-spread');
        });
      });
    }

    async function handleDrawCards() {
      const drawBtn = document.getElementById('draw-btn');
      const cardsDisplay = document.getElementById('cards-display');
      const cardsGrid = document.getElementById('cards-grid');
      const interpretationSection = document.getElementById('interpretation-section');
      const userQuestion = document.getElementById('user-question').value.trim();

      // UI Loading state
      drawBtn.disabled = true;
      drawBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 連結星宿能量中...`;

      // Fetch cards
      drawnCards = await fetchTarotCards(3);

      // Render placeholders
      cardsGrid.innerHTML = '';
      const positions = SPREAD_DEFINITIONS[currentSpreadType];

      positions.forEach((pos, idx) => {
        const cardData = drawnCards[idx];
        const cardEl = document.createElement('div');
        cardEl.className = 'flex flex-col items-center';
        
        cardEl.innerHTML = `
          <div class="text-mystic-gold font-bold text-sm mb-2 tracking-wider flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-mystic-gold inline-block"></span>
            ${pos.label}
          </div>
          <div class="perspective-1000 w-48 h-80 cursor-pointer card-container" onclick="flipCard(this)">
            <div class="card-inner shadow-2xl hover:shadow-glow-purple">
              <!-- Card Back -->
              <div class="card-face card-back flex flex-col items-center justify-center p-3 text-center">
                <div class="w-full h-full border border-mystic-gold/40 rounded-lg p-2 flex flex-col items-center justify-center">
                  <i class="fa-solid fa-compass-drafting text-4xl text-mystic-gold/60 mb-2"></i>
                  <p class="font-cinzel text-xs text-mystic-goldLight">TAP TO REVEAL</p>
                </div>
              </div>
              <!-- Card Front -->
              <div class="card-face card-front flex flex-col items-center p-3 text-center justify-between">
                <div class="text-xs font-bold text-mystic-gold border-b border-mystic-gold/30 w-full pb-1">
                  ${cardData.name_zh} (${cardData.name_en})
                </div>
                <div class="overflow-hidden rounded border border-slate-700 my-2 w-32 h-44 bg-black/40 flex items-center justify-center">
                  <img src="${cardData.image}" alt="${cardData.name_zh}" class="w-full h-full object-cover ${cardData.isReversed ? 'is-reversed-img' : ''}" onerror="this.src='https://placehold.co/150x250/1e1a40/d4af37?text=Tarot+Card'">
                </div>
                <div class="text-xs font-semibold ${cardData.isReversed ? 'text-amber-400' : 'text-emerald-400'}">
                  ${cardData.isReversed ? '【逆位】' : '【正位】'}
                </div>
              </div>
            </div>
          </div>
          <div class="text-xs text-slate-400 text-center mt-2 max-w-[200px]">${pos.desc}</div>
        `;
        cardsGrid.appendChild(cardEl);
      });

      // Reset Draw Button State
      drawBtn.disabled = false;
      drawBtn.innerHTML = `<i class="fa-solid fa-dharmachakra"></i> 重新抽取 3 張塔羅牌`;

      // Show sections
      cardsDisplay.classList.remove('hidden');
      interpretationSection.classList.remove('hidden');

      // Scroll smoothly to cards
      cardsDisplay.scrollIntoView({ behavior: 'smooth' });

      // Auto flip cards with sequence
      setTimeout(() => {
        const containers = document.querySelectorAll('.card-container');
        containers.forEach((c, index) => {
          setTimeout(() => {
            c.querySelector('.card-inner').classList.add('is-flipped');
          }, index * 400);
        });
      }, 500);

      // Render detailed text reading
      renderInterpretation(userQuestion);
    }

    function flipCard(el) {
      el.querySelector('.card-inner').classList.toggle('is-flipped');
    }

    function renderInterpretation(userQuestion) {
      const questionDisplay = document.getElementById('user-question-display');
      const container = document.getElementById('cards-interpretation-container');
      const overallAdviceEl = document.getElementById('overall-advice');

      if (userQuestion) {
        questionDisplay.textContent = `心靈問題詢問：「${userQuestion}」`;
      } else {
        questionDisplay.textContent = `通用綜合指引與運勢解讀`;
      }

      container.innerHTML = '';
      const positions = SPREAD_DEFINITIONS[currentSpreadType];

      drawnCards.forEach((card, index) => {
        const pos = positions[index];
        const stateData = card.isReversed ? card.reversed : card.upright;
        const statusText = card.isReversed ? "逆位 (Reversed)" : "正位 (Upright)";
        const statusBadgeClass = card.isReversed ? "bg-amber-900/40 text-amber-300 border-amber-600/40" : "bg-emerald-900/40 text-emerald-300 border-emerald-600/40";

        const cardDetailHtml = `
          <div class="bg-mystic-900/80 rounded-xl p-5 border border-mystic-gold/20 shadow-md transition hover:border-mystic-gold/40">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-700/60 pb-3 mb-4">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 text-xs font-bold rounded-md bg-mystic-gold/20 text-mystic-gold">
                  ${pos.label}
                </span>
                <h4 class="text-xl font-bold text-slate-100">
                  ${card.name_zh} <span class="text-sm font-cinzel text-slate-400">(${card.name_en})</span>
                </h4>
              </div>
              <span class="px-3 py-1 text-xs font-semibold rounded-full border ${statusBadgeClass}">
                ${statusText}
              </span>
            </div>

            <!-- Core Keywords -->
            <div class="flex flex-wrap gap-2 mb-3">
              <span class="text-xs text-slate-400 self-center">核心關鍵字：</span>
              ${stateData.keywords.map(kw => `<span class="px-2 py-0.5 text-xs rounded bg-mystic-700 text-mystic-goldLight border border-mystic-gold/20"># ${kw}</span>`).join('')}
            </div>

            <!-- Detailed Explanation -->
            <div class="space-y-3 text-sm leading-relaxed text-slate-300">
              <p><strong class="text-mystic-gold">【牌義牌況解析】</strong> ${stateData.meaning}</p>
              <p><strong class="text-amber-300">【對應位置啟示】</strong> 在「${pos.label}」位置出現${card.isReversed ? '逆位' : '正位'}的${card.name_zh}，暗示著${pos.desc}方面，${stateData.advice}</p>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardDetailHtml);
      });

      // Build overall summary
      const firstCardName = drawnCards[0].name_zh;
      const lastCardName = drawnCards[2].name_zh;
      overallAdviceEl.innerHTML = `
        當前牌陣顯示了一個從 <strong>${firstCardName}</strong> 延伸至 <strong>${lastCardName}</strong> 的能量轉化歷程。
        整體而言，塔羅牌建議您保持心境平靜，接受過程中的轉變與考驗。關注內心真正的渴望，付諸實際行動，並隨時調整步伐，未來將能走向更具啟發性的正面格局。
      `;
    }

    function resetReading() {
      document.getElementById('cards-display').classList.add('hidden');
      document.getElementById('interpretation-section').classList.add('hidden');
      document.getElementById('user-question').value = '';
      document.getElementById('setup-section').scrollIntoView({ behavior: 'smooth' });
    }

    // Initialize Event Listeners
    window.addEventListener('DOMContentLoaded', () => {
      generateStarfield();
      initSpreadSelector();

      document.getElementById('draw-btn').addEventListener('click', handleDrawCards);
      document.getElementById('reset-btn').addEventListener('click', resetReading);
    });
  </script>
</body>
</html>
