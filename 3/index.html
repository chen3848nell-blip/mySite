<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣即時天氣 - Taiwan Live Weather</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Weather & UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        weather: {
                            blue: '#1e3c72',
                            sky: '#2a5298',
                            dark: '#0f172a',
                            card: 'rgba(255, 255, 255, 0.15)',
                            cardHover: 'rgba(255, 255, 255, 0.25)',
                            lightCard: 'rgba(255, 255, 255, 0.85)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            color: #ffffff;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .glass-panel-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #1e293b;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom Pulse Loading Animation */
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-fast {
            animation: pulse-fast 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col justify-between items-center">

    <!-- 主容器 -->
    <div class="w-full max-w-5xl mx-auto space-y-6">

        <!-- 頁眉導覽列：城市選單與搜尋 -->
        <header class="glass-panel rounded-3xl p-4 md:p-6 shadow-2xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-blue-500/30 rounded-2xl border border-blue-400/30">
                    <i class="fa-solid fa-cloud-sun-rain text-3xl text-amber-400"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-wide">台灣即時天氣</h1>
                    <p class="text-xs text-slate-300">Open-Meteo API 提供資料</p>
                </div>
            </div>

            <!-- 控制區塊：縣市下拉選單、定位按鈕 -->
            <div class="flex items-center gap-2 w-full md:w-auto">
                <!-- 下拉選單 -->
                <div class="relative flex-1 md:w-48">
                    <select id="citySelect" class="w-full appearance-none bg-slate-800/60 border border-white/20 text-white py-2.5 px-4 pr-10 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer text-sm font-medium">
                        <option value="25.0375,121.5637,台北市">台北市</option>
                        <option value="25.0169,121.4628,新北市">新北市</option>
                        <option value="24.9936,121.3010,桃園市">桃園市</option>
                        <option value="24.8138,120.9675,新竹市">新竹市</option>
                        <option value="24.1477,120.6736,台中市">台中市</option>
                        <option value="24.0518,120.5161,彰化縣">彰化縣</option>
                        <option value="23.4800,120.4491,嘉義市">嘉義市</option>
                        <option value="22.9997,120.2270,台南市">台南市</option>
                        <option value="22.6273,120.3014,高雄市">高雄市</option>
                        <option value="22.0000,120.7500,屏東縣">屏東縣</option>
                        <option value="24.6750,121.7600,宜蘭縣">宜蘭縣</option>
                        <option value="23.9872,121.6016,花蓮縣">花蓮縣</option>
                        <option value="22.7613,121.1444,台東縣">台東縣</option>
                        <option value="23.5711,119.5793,澎湖縣">澎湖縣</option>
                        <option value="24.4493,118.3766,金門縣">金門縣</option>
                        <option value="26.1505,119.9499,連江縣">連江縣</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-white/70">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>

                <!-- GPS 定位按鈕 -->
                <button id="locateBtn" title="自動定位" class="p-2.5 bg-blue-600/60 hover:bg-blue-500/80 active:scale-95 text-white rounded-2xl border border-white/20 transition-all flex items-center justify-center min-w-[42px]">
                    <i class="fa-solid fa-location-crosshairs text-base"></i>
                </button>

                <!-- 手動重新整理 -->
                <button id="refreshBtn" title="重新整理" class="p-2.5 bg-slate-700/60 hover:bg-slate-600/80 active:scale-95 text-white rounded-2xl border border-white/20 transition-all flex items-center justify-center min-w-[42px]">
                    <i class="fa-solid fa-rotate-right text-base" id="refreshIcon"></i>
                </button>
            </div>
        </header>

        <!-- 載入中警示 -->
        <div id="loadingSkeleton" class="hidden glass-panel rounded-3xl p-8 text-center space-y-4">
            <div class="inline-block animate-spin text-4xl text-blue-400">
                <i class="fa-solid fa-circle-notch"></i>
            </div>
            <p class="text-slate-300 font-medium animate-pulse-fast">正在取得即時氣象資料中...</p>
        </div>

        <!-- 錯誤訊息提示盒 -->
        <div id="errorMessage" class="hidden bg-rose-500/20 border border-rose-500/40 text-rose-200 p-4 rounded-2xl text-center backdrop-blur-md">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i>
            <span id="errorText">無法讀取天氣資料，請稍後再試。</span>
        </div>

        <!-- 天氣主要內容區塊 -->
        <main id="weatherContent" class="space-y-6">

            <!-- 今日當前天氣面板 -->
            <div class="glass-panel rounded-3xl p-6 md:p-8 relative overflow-hidden shadow-2xl">
                <!-- 背景裝飾漸層球體 -->
                <div class="absolute -top-16 -right-16 w-64 h-64 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-16 -left-16 w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

                <div class="relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
                    
                    <!-- 左側：地區名稱與當前主要氣溫 -->
                    <div class="lg:col-span-7 flex flex-col justify-between space-y-4">
                        <div class="flex items-center gap-2">
                            <span class="px-3 py-1 bg-blue-500/30 text-blue-200 rounded-full text-xs font-semibold tracking-wide border border-blue-400/30">
                                <i class="fa-solid fa-location-dot mr-1"></i> 即時氣象
                            </span>
                            <span id="updateTime" class="text-xs text-slate-400">更新於 --:--</span>
                        </div>

                        <div>
                            <h2 id="cityName" class="text-3xl md:text-5xl font-extrabold tracking-tight mb-1">台北市</h2>
                            <p id="weatherDesc" class="text-lg md:text-xl text-blue-200 font-medium">晴朗</p>
                        </div>

                        <div class="flex items-baseline gap-4 my-2">
                            <span id="currentTemp" class="text-6xl md:text-8xl font-black tracking-tighter">--</span>
                            <span class="text-3xl md:text-4xl text-slate-300 font-light">°C</span>
                            <div class="text-sm text-slate-300 ml-2 space-y-0.5">
                                <p>體感溫度 <span id="apparentTemp" class="font-bold text-white">--</span>°C</p>
                                <p>今日高低 <span id="tempRange" class="font-bold text-white">--° / --°</span></p>
                            </div>
                        </div>
                    </div>

                    <!-- 右側：主要圖示與重點指數 -->
                    <div class="lg:col-span-5 flex flex-col items-center justify-center border-t lg:border-t-0 lg:border-l border-white/10 pt-6 lg:pt-0 lg:pl-6">
                        <!-- 天氣大圖示 -->
                        <div id="weatherIconContainer" class="text-7xl md:text-8xl text-amber-400 mb-6 filter drop-shadow-lg transform transition-transform hover:scale-105">
                            <i class="fa-solid fa-sun"></i>
                        </div>

                        <!-- 4格簡要數據卡 -->
                        <div class="grid grid-cols-2 gap-3 w-full">
                            <!-- 降雨機率 -->
                            <div class="bg-white/5 hover:bg-white/10 transition-colors p-3 rounded-2xl flex items-center gap-3 border border-white/10">
                                <i class="fa-solid fa-droplet text-blue-400 text-xl w-6 text-center"></i>
                                <div>
                                    <p class="text-xs text-slate-400">降雨機率</p>
                                    <p id="popValue" class="text-sm font-bold">-- %</p>
                                </div>
                            </div>
                            <!-- 風速 -->
                            <div class="bg-white/5 hover:bg-white/10 transition-colors p-3 rounded-2xl flex items-center gap-3 border border-white/10">
                                <i class="fa-solid fa-wind text-teal-400 text-xl w-6 text-center"></i>
                                <div>
                                    <p class="text-xs text-slate-400">風速風向</p>
                                    <p id="windValue" class="text-sm font-bold">-- km/h</p>
                                </div>
                            </div>
                            <!-- 相對濕度 -->
                            <div class="bg-white/5 hover:bg-white/10 transition-colors p-3 rounded-2xl flex items-center gap-3 border border-white/10">
                                <i class="fa-solid fa-water text-cyan-400 text-xl w-6 text-center"></i>
                                <div>
                                    <p class="text-xs text-slate-400">相對濕度</p>
                                    <p id="humidityValue" class="text-sm font-bold">-- %</p>
                                </div>
                            </div>
                            <!-- 紫外線指數 -->
                            <div class="bg-white/5 hover:bg-white/10 transition-colors p-3 rounded-2xl flex items-center gap-3 border border-white/10">
                                <i class="fa-solid fa-sun text-amber-400 text-xl w-6 text-center"></i>
                                <div>
                                    <p class="text-xs text-slate-400">紫外線指數</p>
                                    <p id="uvIndexValue" class="text-sm font-bold">--</p>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 24小時逐時預報 (橫向滑動) -->
            <div class="glass-panel rounded-3xl p-6 shadow-xl">
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fa-regular fa-clock text-blue-400"></i> 24 小時逐時預報
                </h3>
                <div id="hourlyContainer" class="flex gap-4 overflow-x-auto pb-2 pt-1 hide-scrollbar">
                    <!-- 逐時預報項目由 JS 動態生成 -->
                </div>
            </div>

            <!-- 未來 7 天預報 -->
            <div class="glass-panel rounded-3xl p-6 shadow-xl">
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fa-regular fa-calendar-days text-blue-400"></i> 未來 7 天預報
                </h3>
                <div id="dailyContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
                    <!-- 7天預報卡片由 JS 動態生成 -->
                </div>
            </div>

        </main>

        <!-- 頁尾 -->
        <footer class="text-center text-xs text-slate-400 py-4">
            <p>資料來源：<a href="https://open-meteo.com/" target="_blank" class="underline hover:text-white transition-colors">Open-Meteo Free Weather API</a> | 專為台灣各地打造之即時氣象儀表板</p>
        </footer>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        /**
         * Open-Meteo WMO 天氣代碼與對應圖示與中文說明
         */
        const weatherCodeMap = {
            0: { desc: "晴朗", icon: "fa-sun", color: "text-amber-400" },
            1: { desc: "大致晴朗", icon: "fa-sun", color: "text-amber-300" },
            2: { desc: "多雲時晴", icon: "fa-cloud-sun", color: "text-amber-200" },
            3: { desc: "多雲", icon: "fa-cloud", color: "text-slate-300" },
            45: { desc: "起霧", icon: "fa-smog", color: "text-slate-400" },
            48: { desc: "霧霾/凍霧", icon: "fa-smog", color: "text-slate-400" },
            51: { desc: "輕微毛毛雨", icon: "fa-cloud-rain", color: "text-blue-300" },
            53: { desc: "毛毛雨", icon: "fa-cloud-rain", color: "text-blue-400" },
            55: { desc: "強降毛毛雨", icon: "fa-cloud-showers-heavy", color: "text-blue-500" },
            61: { desc: "小雨", icon: "fa-cloud-rain", color: "text-blue-300" },
            63: { desc: "陣雨", icon: "fa-cloud-showers-heavy", color: "text-blue-400" },
            65: { desc: "大雨", icon: "fa-cloud-showers-heavy", color: "text-blue-600" },
            71: { desc: "輕微降雪", icon: "fa-snowflake", color: "text-cyan-200" },
            73: { desc: "降雪", icon: "fa-snowflake", color: "text-cyan-300" },
            75: { desc: "大雪", icon: "fa-snowflake", color: "text-cyan-400" },
            80: { desc: "短暫陣雨", icon: "fa-cloud-sun-rain", color: "text-blue-400" },
            81: { desc: "局部陣雨", icon: "fa-cloud-showers-water", color: "text-blue-500" },
            82: { desc: "劇烈暴雨", icon: "fa-cloud-showers-heavy", color: "text-blue-700" },
            95: { desc: "雷陣雨", icon: "fa-cloud-bolt", color: "text-yellow-400" },
            96: { desc: "雷陣雨伴隨冰雹", icon: "fa-cloud-meatball", color: "text-yellow-500" },
            99: { desc: "劇烈雷暴伴隨冰雹", icon: "fa-cloud-bolt", color: "text-red-500" }
        };

        // DOM 元素引用
        const citySelect = document.getElementById('citySelect');
        const locateBtn = document.getElementById('locateBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const refreshIcon = document.getElementById('refreshIcon');
        
        const loadingSkeleton = document.getElementById('loadingSkeleton');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const weatherContent = document.getElementById('weatherContent');

        const cityNameEl = document.getElementById('cityName');
        const updateTimeEl = document.getElementById('updateTime');
        const weatherDescEl = document.getElementById('weatherDesc');
        const currentTempEl = document.getElementById('currentTemp');
        const apparentTempEl = document.getElementById('apparentTemp');
        const tempRangeEl = document.getElementById('tempRange');
        const weatherIconContainer = document.getElementById('weatherIconContainer');

        const popValueEl = document.getElementById('popValue');
        const windValueEl = document.getElementById('windValue');
        const humidityValueEl = document.getElementById('humidityValue');
        const uvIndexValueEl = document.getElementById('uvIndexValue');

        const hourlyContainer = document.getElementById('hourlyContainer');
        const dailyContainer = document.getElementById('dailyContainer');

        /**
         * 取得風向八方位描述
         */
        function getWindDirection(degree) {
            const directions = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
            const index = Math.round(degree / 45) % 8;
            return directions[index];
        }

        /**
         * 格式化時間 (HH:mm)
         */
        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        /**
         * 格式化星期與日期
         */
        function formatDate(dateString) {
            const date = new Date(dateString);
            const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            const dayName = days[date.getDay()];
            const monthDay = `${date.getMonth() + 1}/${date.getDate()}`;
            return { dayName, monthDay };
        }

        /**
         * 向 Open-Meteo API 發送請求並渲染畫面
         */
        async function fetchWeatherData(lat, lon, cityNameStr) {
            try {
                // UI 載入狀態
                loadingSkeleton.classList.remove('hidden');
                errorMessage.classList.add('hidden');
                weatherContent.classList.add('opacity-40', 'pointer-events-none');
                refreshIcon.classList.add('animate-spin');

                // API URL 構建 (包含即時、逐時及每日預報)
                const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&timezone=Asia%2FTaipei`;

                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('氣象 API 連線異常');

                const data = await response.json();

                // 更新畫面
                renderCurrentWeather(data, cityNameStr);
                renderHourlyForecast(data.hourly);
                renderDailyForecast(data.daily);

                // 成功載入後恢復 UI
                loadingSkeleton.classList.add('hidden');
                weatherContent.classList.remove('opacity-40', 'pointer-events-none');
            } catch (err) {
                console.error("載入天氣資料失敗：", err);
                showError("無法取得天氣資料，請檢查網路連線或稍後再試。");
                loadingSkeleton.classList.add('hidden');
                weatherContent.classList.remove('opacity-40', 'pointer-events-none');
            } finally {
                refreshIcon.classList.remove('animate-spin');
            }
        }

        /**
         * 渲染當前天氣資訊
         */
        function renderCurrentWeather(data, nameStr) {
            const current = data.current;
            const daily = data.daily;

            // 地名與時間
            cityNameEl.textContent = nameStr;
            const now = new Date();
            updateTimeEl.textContent = `更新於 ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            // 天氣狀態
            const codeInfo = weatherCodeMap[current.weather_code] || { desc: "未知", icon: "fa-question", color: "text-slate-300" };
            weatherDescEl.textContent = codeInfo.desc;
            weatherIconContainer.innerHTML = `<i class="fa-solid ${codeInfo.icon} ${codeInfo.color}"></i>`;

            // 氣溫
            currentTempEl.textContent = Math.round(current.temperature_2m);
            apparentTempEl.textContent = Math.round(current.apparent_temperature);

            // 今日最高與最低溫
            const maxTemp = Math.round(daily.temperature_2m_max[0]);
            const minTemp = Math.round(daily.temperature_2m_min[0]);
            tempRangeEl.textContent = `${maxTemp}° / ${minTemp}°`;

            // 四項指標數據
            const pop = daily.precipitation_probability_max[0] !== undefined ? daily.precipitation_probability_max[0] : 0;
            popValueEl.textContent = `${pop}%`;

            const windDirection = getWindDirection(current.wind_direction_10m);
            windValueEl.textContent = `${windDirection} ${Math.round(current.wind_speed_10m)} km/h`;

            humidityValueEl.textContent = `${current.relative_humidity_2m}%`;

            const uv = daily.uv_index_max[0] !== undefined ? daily.uv_index_max[0].toFixed(1) : '--';
            uvIndexValueEl.textContent = uv;
        }

        /**
         * 渲染 24 小時逐時預報
         */
        function renderHourlyForecast(hourly) {
            hourlyContainer.innerHTML = '';

            // 取得當前時間索引
            const now = new Date();
            let startIndex = 0;

            if (hourly.time && hourly.time.length > 0) {
                // 尋找離目前最近的時間點
                const currentTimeStr = now.toISOString().slice(0, 13);
                const foundIndex = hourly.time.findIndex(t => t.startsWith(currentTimeStr));
                if (foundIndex !== -1) startIndex = foundIndex;
            }

            // 取未來 24 小時數據
            const hoursToDisplay = 24;
            for (let i = startIndex; i < startIndex + hoursToDisplay && i < hourly.time.length; i++) {
                const timeStr = formatTime(hourly.time[i]);
                const temp = Math.round(hourly.temperature_2m[i]);
                const pop = hourly.precipitation_probability[i] || 0;
                const code = hourly.weather_code[i];
                const codeInfo = weatherCodeMap[code] || { icon: "fa-sun", color: "text-amber-400" };

                const isNow = (i === startIndex);

                const itemHtml = `
                    <div class="flex-shrink-0 flex flex-col items-center justify-between p-3 min-w-[76px] rounded-2xl ${isNow ? 'bg-blue-600/40 border border-blue-400/50' : 'bg-white/5 border border-white/5'} hover:bg-white/10 transition-all">
                        <span class="text-xs font-medium text-slate-300">${isNow ? '現在' : timeStr}</span>
                        <div class="my-2 text-2xl ${codeInfo.color}">
                            <i class="fa-solid ${codeInfo.icon}"></i>
                        </div>
                        <span class="text-base font-bold my-0.5">${temp}°</span>
                        <div class="flex items-center gap-1 text-[10px] text-blue-300">
                            <i class="fa-solid fa-droplet text-[9px]"></i>
                            <span>${pop}%</span>
                        </div>
                    </div>
                `;
                hourlyContainer.insertAdjacentHTML('beforeend', itemHtml);
            }
        }

        /**
         * 渲染未來 7 天預報
         */
        function renderDailyForecast(daily) {
            dailyContainer.innerHTML = '';

            for (let i = 0; i < daily.time.length && i < 7; i++) {
                const { dayName, monthDay } = formatDate(daily.time[i]);
                const maxTemp = Math.round(daily.temperature_2m_max[i]);
                const minTemp = Math.round(daily.temperature_2m_min[i]);
                const pop = daily.precipitation_probability_max[i] || 0;
                const code = daily.weather_code[i];
                const codeInfo = weatherCodeMap[code] || { desc: "多雲", icon: "fa-cloud", color: "text-slate-300" };

                const isToday = (i === 0);

                const cardHtml = `
                    <div class="glass-panel p-4 rounded-2xl flex flex-col justify-between items-center text-center space-y-2 hover:bg-white/20 transition-all">
                        <div class="text-xs">
                            <p class="font-bold text-white ${isToday ? 'text-blue-300' : ''}">${isToday ? '今天' : dayName}</p>
                            <p class="text-slate-400 text-[11px]">${monthDay}</p>
                        </div>
                        <div class="text-3xl my-1 ${codeInfo.color}">
                            <i class="fa-solid ${codeInfo.icon}"></i>
                        </div>
                        <p class="text-xs font-medium text-slate-200">${codeInfo.desc}</p>
                        <div class="w-full pt-1 border-t border-white/10 flex justify-between items-center text-xs">
                            <span class="font-bold text-white">${maxTemp}°</span>
                            <span class="text-slate-400">${minTemp}°</span>
                        </div>
                        <div class="flex items-center gap-1 text-[11px] text-blue-300">
                            <i class="fa-solid fa-droplet text-[9px]"></i>
                            <span>${pop}%</span>
                        </div>
                    </div>
                `;
                dailyContainer.insertAdjacentHTML('beforeend', cardHtml);
            }
        }

        /**
         * 顯示錯誤訊息
         */
        function showError(msg) {
            errorText.textContent = msg;
            errorMessage.classList.remove('hidden');
        }

        /**
         * 觸發載入指定選單城市
         */
        function loadSelectedCity() {
            const val = citySelect.value.split(',');
            const lat = parseFloat(val[0]);
            const lon = parseFloat(val[1]);
            const cityName = val[2];
            fetchWeatherData(lat, lon, cityName);
        }

        /**
         * 使用瀏覽器 GPS 自動定位
         */
        function locateUser() {
            if (!navigator.geolocation) {
                showError("您的瀏覽器不支援地理定位功能。");
                return;
            }

            loadingSkeleton.classList.remove('hidden');
            errorMessage.classList.add('hidden');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // 檢查是否在台灣區域外
                    let label = "目前位置";
                    fetchWeatherData(lat, lon, label);
                },
                (err) => {
                    console.warn("定位失敗:", err.message);
                    showError("無法讀取您的目前位置，將預設顯示台北市天氣。");
                    loadSelectedCity();
                },
                { timeout: 10000, enableHighAccuracy: true }
            );
        }

        // 事件監聽綁定
        citySelect.addEventListener('change', loadSelectedCity);
        refreshBtn.addEventListener('click', loadSelectedCity);
        locateBtn.addEventListener('click', locateUser);

        // 頁面初次載入
        window.onload = function() {
            loadSelectedCity();
        };
    </script>
</body>
</html>
